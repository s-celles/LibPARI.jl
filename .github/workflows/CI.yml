name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    # Hard gate from M0 onward: source must conform to JuliaFormatter.
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Run JuliaFormatter in check mode
        # The version is pinned to the same minor series as the root and
        # `gen/` [compat] bounds. `src/bindings.jl` is written by the `gen/`
        # environment and checked here, so a version skew between the two
        # makes the generated file fail this gate — and the byte-identical
        # reproducibility test — without any source change.
        run: |
          julia --color=yes --startup-file=no -e '
            using Pkg
            Pkg.add(name = "JuliaFormatter", version = "2.12")
            using JuliaFormatter
            ok = format(["src", "test"]; overwrite = false)
            ok || error("Formatting check failed — run JuliaFormatter.")
          '

  test:
    # Cross-platform hard gate (REQ-QA-07, REQ-QA-08): the suite runs on
    # Linux, macOS, and Windows, and any platform failure fails the build.
    # PARI_jll is now registered in the Julia General registry, so the
    # runners resolve it directly through `Pkg.instantiate` — no out-of-band
    # step needed.
    name: Test (Julia ${{ matrix.version }} — ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The @testitem suite runs single-threaded: the TestItemRunner harness on
    # Julia 1.12 has a concurrent-compilation crash under multi-threaded
    # Julia. LibPARI's libpari calls are themselves thread-safe (M9 /
    # REQ-PLT-03) — verified by the separate multi-threaded concurrency step
    # below, which runs on every platform.
    env:
      JULIA_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-runtest@v1
      - name: Concurrency stress test (multi-threaded — M9 / REQ-PLT-03)
        # `shell: bash` keeps this step identical on the Windows runner.
        shell: bash
        run: |
          julia --project=. --color=yes --threads=auto -e '
            using Pkg
            Pkg.instantiate()
            include("test/concurrency_tests.jl")
          '

  docs:
    # Build the Documenter.jl site and deploy it to GitHub Pages
    # (REQ-DOC-01, REQ-DOC-06). The build is STRICT — any warning or
    # doctest mismatch fails the job (REQ-DOC-04, REQ-DOC-05). `deploydocs`
    # publishes only from the default branch and from tags.
    #
    # `contents: write` is required for `deploydocs` to push to the
    # `gh-pages` branch using the workflow-scoped GITHUB_TOKEN when no
    # repository-level DOCUMENTER_KEY secret is configured.
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # No docs/Manifest.toml is committed: LibPARI is dev-resolved here.
      - name: Instantiate docs environment
        run: |
          julia --project=docs --color=yes -e '
            using Pkg
            Pkg.develop(PackageSpec(path = pwd()))
            Pkg.instantiate()
          '
      - name: Build and deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs --color=yes docs/make.jl
