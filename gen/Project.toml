# Environment for the LibPARI binding generator (milestone M4).
# This is a development-time tool — it is NOT part of the shipped package.
# Run:  julia --project=gen gen/generate.jl
[deps]
JuliaFormatter = "98e50ef6-434e-11e9-1051-2b60c6c9e899"
PARI_jll = "84859880-2197-580f-a1bb-08b6236e0e08"
# Promoted from transitive (via JuliaFormatter) to direct so the
# defensive [compat] bound below can deflect the Julia-1.10 / 1.3.4 trap.
PrecompileTools = "aea7be01-6a6a-4083-8856-8a6e6704d82a"

[compat]
# Pinned to one minor series, and kept identical to the root [compat] and to
# the CI `format` job. `src/bindings.jl` is written by THIS environment and
# checked by the ROOT one: when the two resolved different JuliaFormatter
# 2.x releases (2.12.3 here, 2.10.1 there) they disagreed about the trailing
# `;` in a `let` header, so the committed file failed both the format check
# and the byte-identical reproducibility gate (NFR-04) — 42 sites.
JuliaFormatter = "~2.12"
PARI_jll = "2.17"
# Defensive upper bound: PrecompileTools 1.3.4 references `Base.StaticData`
# unguarded, which UndefVarErrors on Julia 1.10 (see upstream-bugs.md
# 2026-06-04 entry). Pinning the gen env to the last 1.10-safe series
# keeps a Julia-1.12-resolved Manifest replay-able on Julia 1.10.
PrecompileTools = "1.0 - 1.2"
julia = "1.10"
