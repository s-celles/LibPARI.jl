# Pre-commit hooks for LibPARI — file hygiene + JuliaFormatter.
# Setup:  pip install pre-commit  &&  pre-commit install
# Manual: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: juliaformatter
        name: JuliaFormatter (80-column margin)
        description: Format Julia sources per .JuliaFormatter.toml.
        entry: julia --startup-file=no -e "using JuliaFormatter; exit(format(ARGS) ? 0 : 1)"
        language: system
        files: \.jl$
        pass_filenames: true
